[project]
site_url = "https://ania-7abc.github.io/Lcd2004/"
site_name = "Lcd2004 documentation"
site_description = "A clear, lightweight library for liquid crystal displays that is easy to set up"
site_author = "ania_7"

copyright = "Copyright &copy; 2026 ania_7"

repo_url = "https://github.com/ania-7abc/Lcd2004"
repo_name = "ania-7abc/Lcd2004"

[project.theme]
language = "en"
features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "header.autohide",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.prune",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

 [[project.extra.social]]
 icon = "fontawesome/brands/github"
 link = "https://github.com/ania-7abc/Lcd2004"

[project.markdown_extensions]
abbr = { }
admonition = { }
attr_list = { }
def_list = { }
footnotes = { }
md_in_html = { }
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = { }
pymdownx.caret = { }
pymdownx.details = { }
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = { }
pymdownx.keys = { }
pymdownx.magiclink = { }
pymdownx.mark = { }
pymdownx.smartsymbols = { }
 pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = { }
